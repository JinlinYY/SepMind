numerical_policies:
  balanced_reduced: Native DWSIM MESH, balances/reflux eliminated numerically; verified
    case05 and case03; strict trace/specification scaling and feasible initialization
    retained for case03. Initialization is never accepted as a process result
  log_mesh: Experimental diagnostic; not the accepted full-case03 solver policy
external_data_policy: Provider calls do not authorize transmission of every unpublished
  artifact; observe user-specific approvals and keep secrets outside logs
