version: 1
scope: Isolated research diagnostics; not production process model admission
production_registry: tool_registry.yaml
tools:
- action: multifeed_candidate_column
  backend: sepmind.simulation.multifeed.MultiFeedDwsimBackend.column
  input_schema: research_multifeed_column.schema.json
  implemented: true
  requires:
  - allowlisted versioned model card
  - native DWSIM
  - independent port/specification/fugacity/finite-TPD review
  success_means: numerically executed unit only
- action: mixture_probe
  backend: sepmind.simulation.mixture.MixtureDwsimBackend.mixture_probe
  input_schema: research_mixture_probe.schema.json
  implemented: true
  success_means: property diagnostic only
  phase_property_note: Explicit fixed-composition native enthalpy derivative distinguishes complete Cp from the native phase departure slot. Only allowlisted source models and unchanged stencil/domain guards.
